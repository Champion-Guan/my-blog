name: 持续集成

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行单元与集成测试
        run: npm test

      - name: 检查代码规范
        run: npm run lint

      - name: 构建应用
        run: npm run build

      - name: 安装浏览器测试环境
        run: npx playwright install --with-deps chromium

      - name: 运行浏览器端到端测试
        run: npx playwright test
